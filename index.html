<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Counter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agrave+Pro:wght@100..700&display=swap" rel="stylesheet">
</head>
<style>
    body {
        font-family: "Agrave Pro", cursive;
    }
</style>

<body class="bg-purple-200 ">
    <div class="flex justify-center items-center h-screen">
        <div class="bg-purple-50  w-2/4 h-2/4 rounded-2xl transform hover:-translate-y-2 hover:shadow-2xl flex flex-col items-center " id="box">
            <h1 class="text-center p-5 text-purple-900 font-bold text-3xl">Share Your Thoughts</h1>
            <textarea name="message" class="h-3/5 w-4/5 rounded-2xl focus:outline-none border-2 focus:border-purple-500  p-2" id="text"></textarea>
            <div class="pt-3 font-bold" id="count">0 typed / 200 max</div>
            <h2 class="p-2 text-red-700 font-bold hidden" id="limit">⚠️ You have reached the maximum character limit!</h2>
        </div>
        
        
    </div>
    <script src="script.js"></script>
</body>

</html>
